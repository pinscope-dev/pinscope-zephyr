# Pinscope: these two lines. The module switches on the networking, sockets,
# DHCP and settings it uses, and starts itself at boot.
CONFIG_PINSCOPE=y
# The key from the dashboard: here, or PINSCOPE_KEY=psk_... in the environment
# when the build directory is created (see Kconfig).
#CONFIG_PINSCOPE_PROJECT_KEY="psk_..."

# The rest is this sample's own: a web page to reach, and logs worth reading.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_PRINTK=y
