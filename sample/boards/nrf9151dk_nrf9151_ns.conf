# nRF9151 DK, LTE-M / NB-IoT, in the nRF Connect SDK (the modem library is
# not in upstream Zephyr). The modem runs the IP stack (offloaded sockets);
# the connection manager brings LTE up at boot and Pinscope starts once it has
# an address. The page tunnel needs a native IP stack and is not available
# here; logs, metrics, crash reports and updates are.
CONFIG_NRF_MODEM_LIB=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV6=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_START=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_CONNECT=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
