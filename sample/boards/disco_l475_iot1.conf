# B-L475E-IOT01A: WiFi through its Inventek ISM43362 module, which runs the
# TCP/IP stack itself (offloaded sockets), so Zephyr's own buffers stay small:
# the STM32L475 has 128 KB of RAM.
CONFIG_WIFI=y
CONFIG_WIFI_ESWIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
# The eswifi driver asks for 50 KB of heap; Pinscope's connection, the stream
# to the page and DNS need far less, so the heap is set by hand.
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
