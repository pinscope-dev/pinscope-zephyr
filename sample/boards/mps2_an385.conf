# QEMU, no board needed: the Arm MPS2 AN385 (Cortex-M3) with its Ethernet.
#   west build -b mps2/an385 modules/lib/pinscope/sample      (without --sysbuild)
#   qemu-system-arm -M mps2-an385 -nographic -nic user,model=lan9118 -kernel build/zephyr/zephyr.bin
# QEMU from your system (brew install qemu, apt install qemu-system-arm): it
# has the user networking this needs.
CONFIG_NET_L2_ETHERNET=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_NET_CONFIG_SETTINGS=n
# EMULATOR ONLY: QEMU's MPS2 has no random generator, so this build uses a
# predictable one and Zephyr warns that it is not secure. Never on a device.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TEST_CSPRNG_GENERATOR=y
